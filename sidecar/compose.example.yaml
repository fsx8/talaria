# Example compose shape for Talaria.
#
# The prebuilt image (ghcr.io/fsx8/talaria, built by GitHub Actions on
# every push to main) contains the sidecar AND the built SPA. The sidecar
# MUST share the Thunderbird container's network namespace so the
# commonpost addon's HTTP server stays on loopback and the stable token
# never crosses a network. Real values go in a .env file next to this file
# (COMMONPOST_MCP_TOKEN, TALARIA_VAPID_*); never commit them.
#
#   docker compose -f compose.example.yaml up -d talaria
#
services:
  thunderbird:
    image: your-thunderbird-image # commonpost addon installed + configured
    # ... your Thunderbird container's own configuration ...

  talaria:
    image: ghcr.io/fsx8/talaria:latest # or pin a version tag
    depends_on:
      - thunderbird
    network_mode: 'service:thunderbird' # share TB's netns: addon = loopback :8780
    environment:
      COMMONPOST_MCP_TOKEN: ${COMMONPOST_MCP_TOKEN:?set in .env}
      TALARIA_VAPID_PUBLIC_KEY: ${TALARIA_VAPID_PUBLIC_KEY:-}
      TALARIA_VAPID_PRIVATE_KEY: ${TALARIA_VAPID_PRIVATE_KEY:-}
      PORT: '8942'
      COMMONPOST_PORTS: '8780-8789'
    volumes:
      # Push subscriptions survive container replacement.
      - talaria-data:/app/data
    restart: unless-stopped
    # The port lives in Thunderbird's netns; publish it on a private
    # interface or reach it through your authenticating reverse proxy —
    # never bind it publicly without a gate in front.
    ports:
      - '127.0.0.1:8942:8942'

volumes:
  talaria-data:
