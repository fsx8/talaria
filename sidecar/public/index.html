<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Talaria — mail register</title>
    <meta
      name="description"
      content="Talaria: a register view of your Thunderbird mail — read, search and organize from desk or phone."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#101825" />
    <script>
      // Resolve the theme before first paint (anti-FOUC). Reads the settings
      // store's key directly; "system" (or nothing) resolves through the OS
      // preference onto the Talaria identity. The settings store applies the
      // same logic once mounted — this script only covers the pre-paint gap.
      // Legacy fallback: the Round-1 key held "light"|"dark"|"system".
      (function () {
        var theme = null;
        try {
          var raw = localStorage.getItem("talaria.settings");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed.themeId === "string" && parsed.themeId !== "system") {
              theme = parsed.themeId;
            }
          } else {
            var legacy = localStorage.getItem("talaria.theme");
            if (legacy === "light") theme = "talaria-light";
            else if (legacy === "dark") theme = "talaria-dark";
          }
        } catch (e) {
          /* fall through to the OS preference */
        }
        if (!theme) {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "talaria-dark"
            : "talaria-light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

</html>
