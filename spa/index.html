<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Talaria — mail register</title>
    <meta
      name="description"
      content="Talaria: a read-only register view of your Thunderbird mail. Triage from desk or phone."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f2ee" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#10161e" />
    <script>
      // Resolve theme before first paint to avoid a flash of the wrong register.
      (function () {
        try {
          var pref = localStorage.getItem("talaria.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
